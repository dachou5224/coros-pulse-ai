<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>周报点评</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      min-height: fit-content;
      height: auto;
      background: #fff;
      font-family: "Noto Sans SC", sans-serif;
      color: #333;
      position: relative;
      overflow: visible;
    }
    .card-wrapper {
      position: relative;
      overflow: visible;
    }
    .left-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(to bottom, #ff6b35, #f7c59f);
    }
    .main {
      margin-left: 6px;
      padding: 48px 56px 40px;
    }
    .week-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 48px;
      color: #1a1a2e;
      letter-spacing: 0.02em;
      margin-bottom: 36px;
    }
    .metrics-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 40px;
      padding: 24px 28px;
      background: #1a1a2e;
      border-radius: 8px;
    }
    .w-metric {
      flex: 1;
      text-align: center;
    }
    .w-metric-value {
      font-family: "Bebas Neue", sans-serif;
      font-size: 32px;
      color: #ff6b35;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .w-metric-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }
    .status-badges {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .status-badge {
      border: 1px solid #ff6b35;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      color: #ff6b35;
      background: rgba(255, 107, 53, 0.08);
    }
    .section-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .advice-block {
      margin-bottom: 40px;
    }
    .advice-text {
      font-size: 16px;
      line-height: 2.0;
      color: #444;
      white-space: pre-wrap;
      height: auto;
      overflow: visible;
    }
    .next-week-card {
      background: rgba(255, 107, 53, 0.08);
      border-left: 3px solid #ff6b35;
      padding: 16px;
      margin-top: 24px;
    }
    .next-week-title {
      font-size: 13px;
      color: #ff6b35;
      margin-bottom: 8px;
    }
    .next-week-content {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }
    .footer {
      padding: 30px 0 0;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <div class="left-line"></div>
    <div class="main">
    <h1 class="week-title">{{week_label}}</h1>
    <section class="metrics-bar">
      <div class="w-metric">
        <div class="w-metric-value">{{total_km}}</div>
        <div class="w-metric-label">总跑量 (km)</div>
      </div>
      <div class="w-metric">
        <div class="w-metric-value">{{runs}}</div>
        <div class="w-metric-label">出勤次数</div>
      </div>
      <div class="w-metric">
        <div class="w-metric-value">{{ctl}}</div>
        <div class="w-metric-label">CTL</div>
      </div>
      <div class="w-metric">
        <div class="w-metric-value">{{tsb}}</div>
        <div class="w-metric-label">TSB</div>
      </div>
      <div class="w-metric">
        <div class="w-metric-value">{{vdot}}</div>
        <div class="w-metric-label">VDOT</div>
      </div>
    </section>
    <div class="status-badges">
      <span class="status-badge">{{status}}</span>
    </div>
    <div class="section-label">本周诊断</div>
    <div class="advice-block">
      <div class="advice-text">{{advice_text}}</div>
      <div class="next-week-card">
        <div class="next-week-title">📌 下周重点</div>
        <div class="next-week-content">{{next_week_focus}}</div>
      </div>
    </div>
    <footer class="footer">
      {{brand_tag}}
    </footer>
    </div>
  </div>
</body>
</html>
