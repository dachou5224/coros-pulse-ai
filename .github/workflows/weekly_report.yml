name: Weekly Running Analysis

on:
  schedule:
    # 每周日晚上 23:00 北京时间 = 15:00 UTC 周日
    - cron: '0 15 * * 0'
  workflow_dispatch: # 允许手动点击按钮触发测试

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Analysis Script
      continue-on-error: true
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_JSON_KEY }}
        API_KEY: ${{ secrets.API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BASE_URL: ${{ secrets.BASE_URL }}
      run: python src/analysis.py

    - name: Export static JSON snapshots
      if: always()
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PYTHONUTF8: "1"
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_JSON_KEY }}
      run: python scripts/export_static_data.py

    - name: Sync static data to VPS
      if: always() && env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_KEY != ''
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        source: "show/static/data/*.json"
        target: "/var/www/run-home/data"
        strip_components: 3
