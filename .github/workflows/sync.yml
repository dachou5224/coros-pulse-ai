name: Coros Data Sync + Activity Advice

on:
  schedule:
    # 每日 10:00 北京时间 (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync_and_advice:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_KEY: ${{ secrets.VPS_KEY }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Sync Script
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PYTHONUTF8: "1"
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_JSON_KEY }}
      run: python src/main.py

    - name: Run Activity Advice Script
      continue-on-error: true
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PYTHONUTF8: "1"
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_JSON_KEY }}
        # 与本地 .env 一致：任设 API_KEY 或 GEMINI_API_KEY；不设则单次点评静默跳过
        API_KEY: ${{ secrets.API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BASE_URL: ${{ secrets.BASE_URL }}
        # LLM：连接失败/429 时退避重试；逐条点评间隔，减轻对 generativelanguage 的突发连接
        LLM_MAX_ATTEMPTS: "6"
        ACTIVITY_ADVICE_DELAY_SECONDS: "1.5"
      run: python src/activity_advice.py

    - name: Export static JSON snapshots
      if: always()
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
        PYTHONUTF8: "1"
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_JSON_KEY }}
      run: python scripts/export_static_data.py

    - name: Sync static data to VPS
      if: always() && env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_KEY != ''
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        source: "show/static/data/*.json"
        target: "/var/www/run-home/data"
        strip_components: 3
