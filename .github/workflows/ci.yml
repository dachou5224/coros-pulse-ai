# 轻量 CI：语法检查 + 与 Docker 相同的依赖集（不含 playwright，加快 PR 反馈）

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Compile Python
        run: python -m compileall -q src show
