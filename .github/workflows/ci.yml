# 轻量 CI：语法检查 + 与 Docker 相同的依赖集（不含 playwright，加快 PR 反馈）

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Compile Python
        run: python -m compileall -q src show

      - name: Check static frontend scripts
        run: |
          node -e "const fs=require('fs'); new Function(fs.readFileSync('show/static/config.js','utf8')); new Function(fs.readFileSync('show/static/data.js','utf8')); const html=fs.readFileSync('show/static/index.html','utf8'); const blocks=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean); blocks.forEach((code,i)=>new Function(code)); console.log('static frontend syntax ok');"

      - name: Export local static snapshots
        run: python scripts/export_static_data.py
